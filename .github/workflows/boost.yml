name: Boost Contribution Graph

on:
  workflow_dispatch:
  schedule:
    - cron: '30 18 * * *'

permissions:
  contents: write

jobs:
  commit-gen:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Auto Green Activity Generator
        run: |
          git config --global user.name "${{ github.actor }}"
          git config --global user.email "${{ github.actor }}@users.noreply.github.com"
          
          # मागील ४७६ दिवसांत रँडम कमिट्स तयार करणे
          for i in $(seq 476 -1 1); do
            COMMITS=$(( (RANDOM % 7) + 1 ))
            for j in $(seq 1 $COMMITS); do
              DATE=$(date -d "$i days ago" +"%Y-%m-%dT12:$((j*5)):00")
              echo "Activity on $DATE - $j" >> activity.txt
              git add activity.txt
              GIT_AUTHOR_DATE="$DATE" GIT_COMMITTER_DATE="$DATE" git commit -m "Activity on $DATE"
            done
          done
          
          git push origin main
